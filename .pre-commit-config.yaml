repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key

  # gitleaks secret scanning. Uses the gitleaks binary installed into the
  # uv-managed venv by `nogoo9-gitleaks` (see requirements.txt), so it runs
  # through `make format` which activates the venv. Scans staged changes only.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        entry: gitleaks git --pre-commit --redact --staged --verbose --config=.gitleaks.toml
        language: system
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format YAML/Helmfiles
        types: [yaml]
        args: ['--write']
        additional_dependencies:
          - 'prettier@3.6.2'
          - 'prettier-plugin-go-template@0.0.15'
        files: \.(yaml|yml|gotmpl)$

      - id: prettier
        name: Format Other Files
        types_or: [javascript, ts, markdown, mdx, makefile, css, scss, shell, sh, python3]
        args: ['--write']
        additional_dependencies:
          - 'prettier@3.6.2'
          - 'prettier-plugin-sh@0.18.0'
        exclude: '^vendor/|^assets/js/custom.js$'
